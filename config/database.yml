default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# Separate from the single-tenant app's igbn_donation_app_* databases
development:
  <<: *default
  database: donation_saas_development

test:
  <<: *default
  database: donation_saas_test

# Neon. DATABASE_URL is the pooled connection (the "-pooler" host), which runs PgBouncer
# in transaction mode: no prepared statements or advisory locks across a session.
# Migrations use DATABASE_URL_UNPOOLED, see bin/release.
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  prepared_statements: false
  advisory_locks: false
  connect_timeout: 10
