          text: "Otvorite adresu terminala na tabletu ili ekranu. Svaki kartični čitač dobija vlastitu adresu."
      addresses: "Jedna adresa po terminalu"
      address_labels: { main: "Glavni ulaz", women: "Ženski dio", cafe: "Kafić" }
    stats:
