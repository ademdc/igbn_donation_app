          text: "Logo, boje, pozadinska slika i tekstovi. Donatori vide vaše ime, a ne naše."
        - title: "Onoliko terminala koliko vam treba"
          text: "Ulaz, ženski dio, kafić: svaki terminal ima vlastitu adresu i vlastiti kartični čitač."
    pricing:
      title: "Jednostavne cijene za svaki džemat"
      plan: "Džemat"
      price: "35 €"
      per: "mjesečno, plaćanje godišnje (420 € godišnje)"
      includes:
        - "30 dana besplatnog testiranja"
        - "1 terminal uključen"
        - "Vlastiti logo, boje i tekstovi"
        - "Kontrolna ploča sa statistikom"
        - "Potvrda o donaciji putem emaila"
        - "Bez provizije na donacije"
      addon: "Svaki dodatni terminal: +5 € mjesečno"
      guarantee_title: "Garancija povrata novca"
      guarantee: "Ako preko vaših terminala za godinu dana stigne manje donacija od iznosa godišnje naknade, vraćamo vam naknadu."
      cta: "Isprobajte 30 dana besplatno"
      note: "Plaćanje bankovnim transferom. Naknade pružatelja plaćanja plaćate direktno njemu."
    faq:
      title: "Česta pitanja"
      items:
        - q: "Koliko košta nakon 30 dana?"
          a: "35 € mjesečno, uz godišnje plaćanje, dakle 420 € godišnje. Jedan terminal je uključen, a svaki dodatni košta 5 € mjesečno. Plaća se bankovnim transferom. Bez uplate terminali se pauziraju, a vaš račun i podaci ostaju sačuvani."
        - q: "Šta ako kod nas skoro da nema donacija?"
          a: "Onda vam vraćamo novac: ako preko vaših terminala za godinu dana stigne manje donacija od iznosa godišnje naknade, vraćamo vam naknadu."
        - q: "Koji uređaji su nam potrebni?"
          a: "Tablet ili ekran s preglednikom i kartični čitač vašeg pružatelja plaćanja. Za SumUp je to Solo. Aplikaciju ne morate instalirati."
        - q: "Gdje ide novac?"
          a: "Direktno na vaš trgovački račun kod pružatelja plaćanja. Mi nikad nismo između i ništa ne isplaćujemo."
        - q: "Možemo li isprobati bez kartičnog čitača?"
          a: "Da. Svaki novi račun počinje s terminalom u testnom načinu. Novac se ne prenosi, a testna plaćanja se ne pojavljuju u vašim prihodima."
        - q: "Radi li ovo samo sa SumUp-om?"
          a: "Danas je povezan SumUp. Sistem je napravljen tako da se mogu dodati i drugi pružatelji. Javite nam koga koristite."
        - q: "Jesu li naši API ključevi sigurni?"
          a: "Čuvaju se šifrirano i nakon unosa se više nikad ne prikazuju, čak ni na kontrolnoj ploči."
        - q: "Dobijaju li donatori potvrdu?"
          a: "Ko ostavi email adresu, automatski dobija potvrdu u ime vašeg džemata. Ona ne zamjenjuje službenu potvrdu o donaciji za poreske svrhe."
        - q: "Može li se prikazati više jezika?"
          a: "Da. Terminal postoji na njemačkom, bosanskom i engleskom, a svoje tekstove unosite za svaki jezik posebno."
    footer:
      tagline: "Donacije karticom za džamije i džemate."
