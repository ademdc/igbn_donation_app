      contact: "Kontakt"
  app:
    sumup_guide:
      steps:
        - title: "Napravite API ključ"
          text: "Prijavite se na me.sumup.com. Otvorite profil, zatim Settings > For Developers > Toolkit > API Keys. Izaberite Create, dajte ključu ime i koristite tajni ključ (Secret Key)."
          note: "Odmah kopirajte ključ: SumUp ga prikazuje samo jednom."
        - title: "Zapišite kod trgovca"
          text: "Kod trgovca nalazi se u vašem SumUp računu i izgleda ovako: MK01A8C2."
        - title: "Napravite affiliate ključ"
          text: "U istom Toolkitu otvorite Affiliate Keys. Unesite identifikator aplikacije, npr. org.vas-dzemat.donacije, i izaberite Add. SumUp traži ovaj ključ za plaćanja preko čitača."
        - title: "Unesite pristupne podatke"
          text: "Unesite sve na kontrolnoj ploči pod Plaćanja. Odmah to provjeravamo kod SumUp-a."
        - title: "Uparite Solo čitač"
          text: "Uključite Solo i odjavite ga ako je prijavljen. Otvorite gornji meni, zatim Connections, povežite ga na WiFi i izaberite API > Connect. Prikazani kod unesite pod Terminali."
          note: "Kod ističe nakon pet minuta. Najbolje je da Solo ostane na struji."
      docs: "Službeno uputstvo SumUp-a"
    signup:
      title: "Otvorite račun"
      lead: "Za nekoliko minuta imate vlastiti terminal za donacije u testnom načinu."
