          text: "Logo, boje, naslov, podnaslov i iznose birate sami, na svakom jeziku vašeg džemata."
        - title: "Povežite pružatelja plaćanja"
          text: "Unesite pristupne podatke svog pružatelja i uparite kartični čitač. Uputstvo za SumUp nalazi se na kontrolnoj ploči."
