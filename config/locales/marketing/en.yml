en:
  marketing:
    meta:
      title: "Card donations for mosques and communities"
      description: "A donation terminal for your community: choose an amount, tap the card, done. With your own logo, colours and an overview of every donation. The money goes straight to you."
    nav:
      skip: "Skip to content"
      how: "How it works"
      pricing: "Pricing"
      faq: "Questions"
      language: "Language"
      login: "Log in"
      cta: "Try it free"
    hero:
      title: "Card donations, right in your community."
      lead: "A tablet at the entrance, a card reader beside it. People choose an amount and tap their card. The money goes straight to your account, never through us."
      cta: "Try it free"
      note: "30 days free, no credit card needed."
    demo:
      label: "Example of a donation terminal"
      header: "Digital donation"
      subheader: "For our new mosque building"
      custom: "Other amount"
      donate: "Donate now"
      colors: "Your colours"
      color_names: { teal: "Green", blue: "Blue", plum: "Plum", clay: "Terracotta" }
    how:
      title: "How it works"
      steps:
        - title: "Create your account"
          text: "You get your own address and a first terminal in test mode, so you can see how everything looks right away."
        - title: "Design your terminal"
          text: "Set the logo, colours, header, subheader and amounts yourself, in every language your community speaks."
        - title: "Connect your payment provider"
          text: "Enter your provider's credentials and pair the card reader. You'll find the SumUp guide in your dashboard."
        - title: "Set up the tablet"
          text: "Open the terminal's address on a tablet or screen. Each card reader gets its own address."
      addresses: "One address per terminal"
      address_labels: { main: "Main entrance", women: "Women's area", cafe: "Café" }
    stats:
      title: "Every donation at a glance"
      text: "Your dashboard shows what came in today, this month and in total, and how much each terminal contributes."
      points:
        - "Totals per day, week and month"
        - "All terminals compared"
        - "Every donation with its status and terminal"
        - "Test payments never count as income"
      mock_label: "Last 30 days"
    benefits:
      title: "Made for the community, not the office"
      items:
        - title: "The money goes straight to you"
          text: "Payments run through your own merchant account. We never touch your money."
        - title: "Your provider, your keys"
          text: "You connect your own account. Your API keys are stored encrypted and never shown again."
        - title: "Looks like your community"
          text: "Logo, colours, background image and wording. Donors see your name, not ours."
        - title: "As many terminals as you need"
          text: "Entrance, women's area, café: each terminal has its own address and its own card reader."
    pricing:
      title: "Simple pricing for every community"
      plan: "Community"
      price: "€35"
      per: "per month, billed yearly (€420 a year)"
      includes:
        - "Free to test for 30 days"
        - "1 terminal included"
        - "Your own logo, colours and wording"
        - "Dashboard with statistics"
        - "Donation confirmation by email"
        - "No commission on donations"
      addon: "Each extra terminal: +€5 per month"
      guarantee_title: "Money-back guarantee"
      guarantee: "If your terminals take less in donations in a year than the yearly fee, we refund the difference. For example: with €300 in donations and a €420 fee, you get €120 back."
      cta: "Try it free for 30 days"
      note: "Paid by bank transfer. You pay your payment provider's fees directly to them."
    faq:
      title: "Common questions"
      items:
        - q: "What does it cost after the 30 days?"
          a: "€35 per month, billed yearly, so €420 a year. One terminal is included, and each extra one costs €5 per month. You pay by bank transfer. Without payment the terminals pause, and your account and data stay safe."
        - q: "What if we hardly get any donations?"
          a: "Then we cover the difference: if your terminals take less in donations in a year than the yearly fee, we refund the gap between the two. With €300 in donations and a €420 fee, you get €120 back."
        - q: "What devices do we need?"
          a: "A tablet or screen with a browser and a card reader from your payment provider. For SumUp that's the Solo. There's no app to install."
        - q: "Where does the money go?"
          a: "Straight to your merchant account with the payment provider. We're never in between and don't pay anything out."
        - q: "Can we try it without a card reader?"
          a: "Yes. Every new account starts with a terminal in test mode. No money moves, and test payments don't appear in your income."
        - q: "Does it only work with SumUp?"
          a: "SumUp is connected today. The system is built so more providers can be added. Tell us which one you use."
        - q: "Are our API keys safe?"
          a: "They're stored encrypted and never shown again after you enter them, not even in the dashboard."
        - q: "Do donors get a confirmation?"
          a: "Anyone who gives an email address automatically gets a confirmation in your community's name. It doesn't replace an official donation receipt for tax purposes."
        - q: "Can we show several languages?"
          a: "Yes. The terminal comes in German, Bosnian and English, and you enter your wording for each language separately."
    imprint:
      contact: "Contact"
      email: "Email"
      representative: "Represented by"
      director: "Director"
      register: "Company register"
      jib: "Identification number (JIB)"
      mbs: "Registration number (MBS)"
      pdv: "VAT number (PDV, Bosnia and Herzegovina)"
      country: "Bosnia and Herzegovina"
    footer:
      tagline: "Card donations for mosques and communities."
      imprint: "Legal notice"
      privacy: "Privacy"
      terms: "Terms"
      contact: "Contact"
  app:
    sumup_guide:
      steps:
        - title: "Create an API key"
          text: "Log in at me.sumup.com. Open your profile, then Settings > For Developers > Toolkit > API Keys. Choose Create, name the key and use the secret key."
          note: "Copy the key straight away: SumUp only shows it once."
        - title: "Note your merchant code"
          text: "Your merchant code is in your SumUp account and looks like this: MK01A8C2."
        - title: "Create an affiliate key"
          text: "In the same Toolkit, open Affiliate Keys. Enter an application identifier, for example org.your-community.donations, and choose Add. SumUp requires this key for card reader payments."
        - title: "Enter your credentials"
          text: "Enter everything under Payments in your dashboard. We check it with SumUp straight away."
        - title: "Pair the Solo reader"
          text: "Turn the Solo on and log it out if it's logged in. Open the top menu, then Connections, connect it to Wi-Fi and choose API > Connect. Enter the code it shows under Terminals."
          note: "The code expires after five minutes. It's best to keep the Solo plugged in."
      docs: "SumUp's official guide"
    signup:
      title: "Create your account"
      lead: "In a few minutes you'll have your own donation terminal in test mode."
      facts:
        - "30 days free, no credit card needed"
        - "Try your terminal right away in test mode"
        - "Connect a payment provider when you're ready"
      organisation: "Your community"
      you: "Your login"
      submit: "Create account"
      subdomain_hint: "This is the address of your dashboard."
      terms_html: "I am at least 18 and authorised to act for this community. I accept the %{terms} and have read the %{privacy}."
      terms_link: "terms"
      fields:
        organisation_name: "Name of your community"
        subdomain: "Your address"
    account_lookups:
      title: "Log in"
      lead: "Enter your email address and we'll send you your community's login link."
      submit: "Send link"
      sent: "If we know an account for this address, the login link is on its way."
