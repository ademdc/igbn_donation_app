  app:
    sumup_guide:
      steps:
        - title: "API-Schlüssel erstellen"
          text: "Melden Sie sich auf me.sumup.com an. Öffnen Sie Ihr Profil, dann Settings > For Developers > Toolkit > API Keys. Wählen Sie „Create“, vergeben Sie einen Namen und nutzen Sie den geheimen Schlüssel (Secret Key)."
          note: "Kopieren Sie den Schlüssel sofort: SumUp zeigt ihn nur einmal an."
        - title: "Händlercode notieren"
          text: "Ihr Händlercode steht in Ihrem SumUp-Konto und sieht zum Beispiel so aus: MK01A8C2."
        - title: "Affiliate-Schlüssel erstellen"
          text: "Im selben Toolkit öffnen Sie „Affiliate Keys“. Tragen Sie eine Anwendungskennung ein, zum Beispiel org.ihre-gemeinde.spenden, und wählen Sie „Add“. SumUp verlangt diesen Schlüssel für Zahlungen über Kartenleser."
        - title: "Zugangsdaten eintragen"
          text: "Tragen Sie alles im Dashboard unter „Zahlungen“ ein. Wir prüfen die Daten direkt bei SumUp."
        - title: "Solo-Leser koppeln"
          text: "Schalten Sie den Solo ein und melden Sie ihn ab, falls er angemeldet ist. Öffnen Sie oben das Menü, dann Connections, verbinden Sie ihn mit dem WLAN und wählen Sie API > Connect. Geben Sie den angezeigten Code unter „Terminals“ ein."
          note: "Der Code läuft nach fünf Minuten ab. Lassen Sie den Solo am besten am Strom."
      docs: "Offizielle Anleitung von SumUp"
    signup:
      title: "Konto anlegen"
      lead: "In wenigen Minuten haben Sie ein eigenes Spendenterminal im Testmodus."
      facts:
