      steps:
        - title: "Konto anlegen"
          text: "Sie erhalten eine eigene Adresse und ein erstes Terminal im Testmodus. So sehen Sie sofort, wie alles aussieht."
        - title: "Terminal gestalten"
          text: "Logo, Farben, Überschrift, Unterzeile und Beträge legen Sie selbst fest, in jeder Sprache Ihrer Gemeinde."
        - title: "Zahlungsanbieter verbinden"
          text: "Tragen Sie die Zugangsdaten Ihres Anbieters ein und koppeln Sie den Kartenleser. Die Anleitung für SumUp finden Sie im Dashboard."
        - title: "Tablet aufstellen"
          text: "Öffnen Sie die Adresse des Terminals auf einem Tablet oder Bildschirm. Jeder Kartenleser bekommt seine eigene Adresse."
      addresses: "Eine Adresse pro Terminal"
      address_labels: { main: "Haupteingang", women: "Frauenbereich", cafe: "Café" }
    stats:
      title: "Alle Spenden auf einen Blick"
      text: "Im Dashboard sehen Sie, was heute, diesen Monat und insgesamt eingegangen ist, und welches Terminal wie viel beiträgt."
      points:
        - "Summen pro Tag, Woche und Monat"
        - "Vergleich aller Terminals"
        - "Jede Spende mit Status und Terminal"
        - "Testzahlungen zählen nie zu den Einnahmen"
      mock_label: "Letzte 30 Tage"
    benefits:
      title: "Gemacht für die Gemeinde, nicht fürs Büro"
      items:
        - title: "Das Geld geht direkt an Sie"
          text: "Zahlungen laufen über Ihr eigenes Händlerkonto. Wir berühren Ihr Geld nie."
        - title: "Ihr Anbieter, Ihre Schlüssel"
          text: "Sie verbinden Ihr eigenes Konto. Ihre API-Schlüssel werden verschlüsselt gespeichert und nie wieder angezeigt."
        - title: "Sieht aus wie Ihre Gemeinde"
          text: "Logo, Farben, Hintergrundbild und Texte. Spender sehen Ihren Namen, nicht unseren."
        - title: "So viele Terminals, wie Sie brauchen"
          text: "Eingang, Frauenbereich, Café: Jedes Terminal hat seine eigene Adresse und seinen eigenen Kartenleser."
    pricing:
      title: "Einfache Preise für jede Gemeinde"
      plan: "Gemeinde"
      price: "35 €"
      per: "pro Monat, jährlich abgerechnet (420 € im Jahr)"
      includes:
        - "30 Tage kostenlos testen"
        - "1 Terminal inklusive"
        - "Eigenes Logo, eigene Farben, eigene Texte"
        - "Dashboard mit Statistiken"
        - "Spendenbestätigung per E-Mail"
        - "Keine Provision auf Spenden"
      addon: "Jedes weitere Terminal: +5 € pro Monat"
      guarantee_title: "Geld-zurück-Garantie"
      guarantee: "Gehen über Ihre Terminals in einem Jahr weniger Spenden ein, als die Jahresgebühr beträgt, erstatten wir Ihnen die Gebühr."
      cta: "30 Tage kostenlos testen"
      note: "Bezahlung per Banküberweisung. Die Gebühren Ihres Zahlungsanbieters zahlen Sie direkt an ihn."
    faq:
      title: "Häufige Fragen"
      items:
        - q: "Was kostet es nach den 30 Tagen?"
          a: "35 € pro Monat, jährlich abgerechnet, also 420 € im Jahr. Ein Terminal ist enthalten, jedes weitere kostet 5 € pro Monat. Bezahlt wird per Banküberweisung. Ohne Zahlung pausieren die Terminals, Ihr Konto und Ihre Daten bleiben erhalten."
        - q: "Was, wenn bei uns kaum gespendet wird?"
          a: "Dann bekommen Sie Ihr Geld zurück: Gehen über Ihre Terminals in einem Jahr weniger Spenden ein, als die Jahresgebühr beträgt, erstatten wir Ihnen die Gebühr."
        - q: "Welche Geräte brauchen wir?"
          a: "Ein Tablet oder einen Bildschirm mit Browser und einen Kartenleser Ihres Zahlungsanbieters. Für SumUp ist das der Solo. Eine App müssen Sie nicht installieren."
        - q: "Wohin geht das Geld?"
          a: "Direkt auf Ihr Händlerkonto beim Zahlungsanbieter. Wir sind nie dazwischen und zahlen nichts aus."
        - q: "Können wir das ausprobieren, ohne einen Kartenleser zu haben?"
          a: "Ja. Jedes neue Konto startet mit einem Terminal im Testmodus. Es wird kein Geld bewegt, und Testzahlungen tauchen nicht in Ihren Einnahmen auf."
        - q: "Geht das nur mit SumUp?"
          a: "Heute ist SumUp angebunden. Das System ist so gebaut, dass weitere Anbieter dazukommen können. Schreiben Sie uns, welchen Sie nutzen."
        - q: "Sind unsere API-Schlüssel sicher?"
          a: "Sie werden verschlüsselt gespeichert und nach dem Eintragen nie wieder angezeigt, auch nicht im Dashboard."
        - q: "Bekommen Spender eine Bestätigung?"
          a: "Wer seine E-Mail-Adresse angibt, erhält automatisch eine Bestätigung im Namen Ihrer Gemeinde. Sie ersetzt keine Zuwendungsbestätigung für das Finanzamt."
        - q: "Können mehrere Sprachen angezeigt werden?"
          a: "Ja. Das Terminal gibt es auf Deutsch, Bosnisch und Englisch, und Ihre Texte tragen Sie für jede Sprache einzeln ein."
